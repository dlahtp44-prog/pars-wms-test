<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>재고 이동</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/app.css">
</head>
<body>

<h2>재고 이동 (PC)</h2>

<form method="post" action="/api/move">

    <label>창고</label>
    <input name="warehouse" value="MAIN" required>

    <label>출발 로케이션</label>
    <input name="from_location" required>

    <label>도착 로케이션</label>
    <input name="to_location" required>

    <label>품번</label>
    <input name="item_code" required>

    <label>LOT</label>
    <input name="lot" required>

    <label>수량</label>
    <input type="number" name="qty" min="1" required>

    <label>비고</label>
    <input name="note">

    <button type="submit">이동 실행</button>
</form>

</body>
</html>
