{% extends "base.html" %}
{% block content %}

<h2>이력조회</h2>

<div class="card">
  <div class="grid-4">
    <input id="year" placeholder="연(YYYY)">
    <input id="month" placeholder="월(1-12)">
    <input id="day" placeholder="일(1-31)">
    <input id="limit" value="200">
  </div>

  <div class="actions">
    <button onclick="searchHistory()">검색</button>
    <a class="link" href="/page/history/excel">엑셀 다운로드</a>
    <a class="link" href="/">메인</a>
  </div>
</div>

<table>
  <thead>
    <tr>
      <th>id</th>
      <th>created_at</th>
      <th>type</th>
      <th>창고</th>
      <th>품번</th>
      <th>품명</th>
      <th>LOT</th>
      <th>규격</th>
      <th>FROM</th>
      <th>TO</th>
      <th>수량</th>
      <th>비고</th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>

<script>
async function searchHistory() {
  const y = document.getElementById("year").value;
  const m = document.getElementById("month").value;
  const d = document.getElementById("day").value;
  const l = document.getElementById("limit").value || 200;

  const params = new URLSearchParams();
  if (y) params.append("year", y);
  if (m) params.append("month", m);
  if (d) params.append("day", d);
  params.append("limit", l);

  const res = await fetch(`/api/history?${params.toString()}`);
  const data = await res.json();

  const tbody = document.getElementById("rows");
  tbody.innerHTML = "";

  data.forEach(r => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${r.id}</td>
      <td>${r.created_at}</td>
      <td>${r.type}</td>
      <td>${r.warehouse || ""}</td>
      <td>${r.item_code}</td>
      <td>${r.item_name}</td>
      <td>${r.lot}</td>
      <td>${r.spec}</td>
      <td>${r.from || ""}</td>
      <td>${r.to || ""}</td>
      <td>${r.qty}</td>
      <td>${r.remark || ""}</td>
    `;
    tbody.appendChild(tr);
  });
}

// 최초 진입 시 자동 조회
searchHistory();
</script>

{% endblock %}
