{% extends "base.html" %}
{% block title %}이력조회{% endblock %}

{% block content %}
<div class="card">
  <h2>이력조회</h2>

  <!-- 검색 조건 -->
  <form id="searchForm" class="form-grid" onsubmit="searchHistory(); return false;">
    <div>
      <label>연(YYYY)</label>
      <input type="number" id="year" placeholder="예: 2026">
    </div>

    <div>
      <label>월(1-12)</label>
      <input type="number" id="month" placeholder="예: 1">
    </div>

    <div>
      <label>일(1-31)</label>
      <input type="number" id="day" placeholder="예: 4">
    </div>

    <div>
      <label>표시건수</label>
      <input type="number" id="limit" value="200">
    </div>

    <div style="grid-column: span 4;">
      <button type="submit" class="btn-primary">🔍 검색</button>
      <a href="/page/excel" class="btn-link">엑셀 센터</a>
      <a href="/" class="btn-link">메인</a>
    </div>
  </form>

  <!-- 결과 테이블 -->
  <table class="table">
    <thead>
      <tr>
        <th>id</th>
        <th>일시</th>
        <th>구분</th>
        <th>창고</th>
        <th>품번</th>
        <th>품명</th>
        <th>LOT</th>
        <th>규격</th>
        <th>FROM</th>
        <th>TO</th>
        <th>수량</th>
      </tr>
    </thead>
    <tbody id="historyBody"></tbody>
  </table>
</div>

<script>
async function searchHistory() {
  const year = document.getElementById("year").value;
  const month = document.getElementById("month").value;
  const day = document.getElementById("day").value;
  const limit = document.getElementById("limit").value || 200;

  const params = new URLSearchParams();
  if (year) params.append("year", year);
  if (month) params.append("month", month);
  if (day) params.append("day", day);
  params.append("limit", limit);

  const res = await fetch(`/api/history?${params.toString()}`);
  const data = await res.json();

  const tbody = document.getElementById("historyBody");
  tbody.innerHTML = "";

  if (data.length === 0) {
    tbody.innerHTML = `<tr><td colspan="11">조회 결과 없음</td></tr>`;
    return;
  }

  for (const row of data) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${row.id}</td>
      <td>${row.created_at}</td>
      <td>${row.type}</td>
      <td>${row.warehouse || ""}</td>
      <td>${row.item_code || ""}</td>
      <td>${row.item_name || ""}</td>
      <td>${row.lot || ""}</td>
      <td>${row.spec || ""}</td>
      <td>${row.from_location || ""}</td>
      <td>${row.to_location || ""}</td>
      <td>${row.qty}</td>
    `;
    tbody.appendChild(tr);
  }
}

// 최초 로딩 시 기본 조회
searchHistory();
</script>
{% endblock %}
