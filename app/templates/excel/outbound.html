<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="/static/app.css"/>
  <title>출고 엑셀 업로드</title>
</head>
<body>
<div class="container">
  <div class="card">
    <h2>출고 엑셀 업로드</h2>
    <p class="small">필수 컬럼: 로케이션, 품번, 품명, LOT, 규격, 수량 (선택: 창고, 브랜드, 비고)</p>

    <form method="post" action="/api/excel/outbound" enctype="multipart/form-data">
      <label>기본 창고(엑셀에 '창고' 컬럼 없을 때 사용)</label>
      <input name="warehouse_default" value="MAIN"/>

      <label>엑셀 파일(xlsx)</label>
      <input type="file" name="file" accept=".xlsx" required/>

      <label>작업자</label>
      <input name="operator" value=""/>

      <label>비고(기본값)</label>
      <input name="note" value=""/>

      <div class="actions">
        <button class="btn" type="submit">업로드</button>
        <a class="btn secondary" href="/page/excel">센터</a>
      </div>
    </form>
  </div>
</div>
</body>
</html>
