<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>이동 (PC)</title>
</head>
<body>

<h2>재고 이동</h2>

<form method="post" action="/api/move">
    <label>창고</label><br>
    <input name="warehouse" required><br><br>

    <label>출발 로케이션</label><br>
    <input name="from_location" required><br><br>

    <label>도착 로케이션</label><br>
    <input name="to_location" required><br><br>

    <label>품번</label><br>
    <input name="item_code" required><br><br>

    <label>LOT</label><br>
    <input name="lot" required><br><br>

    <label>수량</label><br>
    <input type="number" name="qty" required><br><br>

    <label>비고</label><br>
    <input name="note"><br><br>

    <button type="submit">이동 실행</button>
</form>

</body>
</html>
