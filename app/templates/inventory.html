<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="/static/app.css"/>
  <title>재고조회(현재고)</title>
</head>
<body>
<div class="container">
  <div class="card">
    <h2>재고조회 (현재고)</h2>

    <form method="get" action="/page/inventory">
      <div class="grid2">
        <div>
          <label>창고</label>
          <input name="warehouse" value="{{warehouse}}" placeholder="예: MAIN"/>
        </div>
        <div>
          <label>로케이션</label>
          <input name="location" value="{{location}}" placeholder="예: D01-01"/>
        </div>
        <div>
          <label>표시개수(limit)</label>
          <input name="limit" value="{{limit}}" placeholder="예: 200"/>
        </div>
        <div>
          <label>0수량 포함</label>
          <select name="show_zero">
            <option value="0" {% if not show_zero %}selected{% endif %}>미포함(기본)</option>
            <option value="1" {% if show_zero %}selected{% endif %}>포함</option>
          </select>
        </div>
      </div>

      <div style="display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;">
        <button class="btn" type="submit">검색</button>
        <a class="btn" href="/page/inventory/excel?warehouse={{warehouse}}&location={{location}}">📥 재고 엑셀 다운로드</a>
        <a class="btn secondary" href="/">메인</a>
      </div>
    </form>

    <p class="small" style="margin-top:10px;">
      ※ 재고조회는 <b>inventory(현재고)</b> 테이블 기준입니다. (이력/비고가 아니라 현재 수량만 표시)
    </p>

    <div style="overflow:auto; margin-top:14px;">
      <table>
        <thead>
          <tr>
            <th class="small">업데이트</th>
            <th>창고</th>
            <th>로케이션</th>
            <th>브랜드</th>
            <th>품번</th>
            <th>품명</th>
            <th>LOT</th>
            <th>규격</th>
            <th style="text-align:right;">수량</th>
          </tr>
        </thead>
        <tbody>
        {% for r in rows %}
          <tr>
            <td class="small">{{r.updated_at}}</td>
            <td>{{r.warehouse}}</td>
            <td><b>{{r.location}}</b></td>
            <td>{{r.brand}}</td>
            <td><b>{{r.item_code}}</b></td>
            <td>{{r.item_name}}</td>
            <td>{{r.lot}}</td>
            <td>{{r.spec}}</td>
            <td style="text-align:right;"><b>{{r.qty}}</b></td>
          </tr>
        {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
