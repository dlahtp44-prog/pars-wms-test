<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="/static/app.css"/>
  <title>재고조회</title>
</head>
<body>
<div class="container">
  <div class="card">
    <h2>재고조회</h2>

    <form method="get" action="/page/inventory">
      <div class="grid2">
        <div>
          <label>창고</label>
          <input name="warehouse" value="{{warehouse}}" placeholder="예: MAIN"/>
        </div>
        <div>
          <label>로케이션</label>
          <input name="location" value="{{location}}" placeholder="예: D01-01"/>
        </div>
        <div>
          <label>표시개수(limit)</label>
          <input name="limit" value="{{limit}}" placeholder="예: 200"/>
        </div>
      </div>
      <div class="actions">
        <button class="btn" type="submit">검색</button>
        <a class="btn" href="/page/inventory/excel?warehouse={{warehouse}}&location={{location}}">📥 재고 엑셀 다운로드</a>
        <a class="btn secondary" href="/">메인</a>
      </div>
    </form>

    <div style="overflow:auto; margin-top:14px;">
      <table>
        <thead>
          <tr>
            <th>업데이트</th>
            <th>창고</th>
            <th>로케이션</th>
            <th>브랜드</th>
            <th>품번</th>
            <th>품명</th>
            <th>LOT</th>
            <th>규격</th>
            <th>수량</th>
            <th>비고</th>
          </tr>
        </thead>
        <tbody>
        {% for r in rows %}
          <tr>
            <td class="small">{{r.updated_at}}</td>
            <td>{{r.warehouse}}</td>
            <td>{{r.location}}</td>
            <td>{{r.brand}}</td>
            <td>{{r.item_code}}</td>
            <td>{{r.item_name}}</td>
            <td>{{r.lot}}</td>
            <td>{{r.spec}}</td>
            <td style="text-align:right;">{{r.qty}}</td>
            <td>{{r.note}}</td>
          </tr>
        {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
