<!doctype html><html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><link rel="stylesheet" href="/static/app.css"/><title>재고조회</title></head><body>
<div class="container"><div class="card"><h2>재고조회</h2>
<form method="get" action="/page/inventory" class="actions">
<input style="max-width:160px" name="limit" value="{{limit}}"/><button type="submit">조회</button>
<a class="btn" href="/page/excel/inventory/download">재고 엑셀 다운로드</a><a class="btn secondary" href="/">메인</a>
</form>
<div style="overflow:auto;margin-top:14px;"><table><thead><tr>
<th>창고</th><th>로케이션</th><th>브랜드</th><th>품번</th><th>품명</th><th>LOT</th><th>규격</th><th style="text-align:right;">수량</th><th>비고</th><th class="small">업데이트</th>
</tr></thead><tbody>
{% for r in rows %}<tr>
<td>{{r.warehouse}}</td><td>{{r.location}}</td><td>{{r.brand}}</td><td>{{r.item_code}}</td><td>{{r.item_name}}</td><td>{{r.lot}}</td><td>{{r.spec}}</td><td style="text-align:right;">{{r.qty}}</td><td>{{r.note}}</td><td class="small">{{r.updated_at}}</td>
</tr>{% endfor %}
</tbody></table></div></div></div></body></html>
