<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>

<style>
@page {
  size: {{ width_mm }}mm {{ height_mm }}mm;
  margin: 0;
}
.label {
  width: {{ width_mm }}mm;
  height: {{ height_mm }}mm;
  page-break-after: always;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.loc {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 3mm;
}
</style>
</head>

<body>
{% set idx = 0 %}
{% for loc in locations %}
  {% for i in range(qty) %}
    <div class="label">
        <div class="loc">{{ loc }}</div>
        <div id="qr-{{ idx }}"></div>
    </div>
    {% set idx = idx + 1 %}
  {% endfor %}
{% endfor %}

<script>
let idx = 0;
{% for loc in locations %}
  {% for i in range(qty) %}
    new QRCode(
      document.getElementById("qr-" + idx),
      "type=LOC&location={{ loc }}"
    );
    idx++;
  {% endfor %}
{% endfor %}
</script>

</body>
</html>
