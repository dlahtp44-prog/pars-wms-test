<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>달력 메모</title>
  <link rel="stylesheet" href="/static/app.css" />
  <style>
    .cal-wrap{max-width:1100px;margin:24px auto;padding:0 16px;}
    .cal-head{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px;}
    .cal-head .left{display:flex;gap:8px;align-items:center;}
    .cal-title{font-size:20px;font-weight:800;}
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
    .dow{opacity:.8;font-size:12px;text-align:center;padding:8px 0;}
    .day{background:#0f1622;border:1px solid rgba(255,255,255,.06);border-radius:14px;min-height:92px;padding:10px;cursor:pointer;position:relative;}
    .day:hover{border-color:rgba(100,140,255,.35);}
    .day .num{font-weight:800;font-size:14px;opacity:.9;}
    .day .dot{position:absolute;right:10px;top:10px;width:8px;height:8px;border-radius:999px;background:#4ea1ff;display:none;}
    .day.has-memo .dot{display:block;}
    .day .preview{margin-top:8px;font-size:12px;line-height:1.35;opacity:.85;white-space:pre-wrap;max-height:48px;overflow:hidden;}
    .day.off{opacity:.35;cursor:default;}
    .panel{margin-top:14px;display:grid;grid-template-columns:1fr;gap:10px;}
    .panel .box{background:#0f1622;border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:14px;}
    textarea{width:100%;min-height:140px;resize:vertical;background:#0b1220;color:#fff;border:1px solid rgba(255,255,255,.10);border-radius:12px;padding:10px;}
    .row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;}
    .btn{background:#1f2a3d;border:1px solid rgba(255,255,255,.12);color:#fff;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer;}
    .btn.primary{background:#2b6cff;border-color:rgba(43,108,255,.65);}
    .btn:disabled{opacity:.5;cursor:not-allowed;}
    .muted{opacity:.75;font-size:12px;}
    .backlink{display:inline-block;margin:10px 0 0 0;opacity:.9;}
    @media (min-width: 980px){
      .panel{grid-template-columns: 1fr 380px;}
      textarea{min-height:220px;}
    }
  </style>
</head>
<body>
  <div class="cal-wrap">
    <div class="cal-head">
      <div class="left">
        <button class="btn" id="prevBtn">◀</button>
        <button class="btn" id="todayBtn">오늘</button>
        <button class="btn" id="nextBtn">▶</button>
      </div>
      <div class="cal-title" id="title">달력</div>
      <div>
        <a class="btn" href="/">홈</a>
      </div>
    </div>

    <div class="cal-grid" id="dow"></div>
    <div class="cal-grid" id="grid"></div>

    <div class="panel">
      <div class="box">
        <div class="row">
          <div>
            <div style="font-weight:900;font-size:16px" id="selDateLabel">날짜 선택</div>
            <div class="muted" id="updatedAt"></div>
          </div>
        </div>
        <div style="margin-top:10px;">
          <textarea id="memo" placeholder="메모를 입력하세요 (공유용)"></textarea>
        </div>
        <div class="row" style="margin-top:10px;">
          <button class="btn primary" id="saveBtn" disabled>저장</button>
          <span class="muted">※ 달이 넘어가도 메모는 유지됩니다.</span>
        </div>
      </div>

      <div class="box">
        <div style="font-weight:900;margin-bottom:8px;">사용 방법</div>
        <div class="muted" style="line-height:1.6;">
          1) 날짜 클릭 → 메모 작성 → 저장<br/>
          2) 메모가 있는 날짜는 파란 점으로 표시<br/>
          3) 공유 메모(로그인 기능 전 단계)
        </div>
      </div>
    </div>
  </div>

<script>
  const DOW = ["일","월","화","수","목","금","토"];
  const dowEl = document.getElementById("dow");
  const gridEl = document.getElementById("grid");
  const titleEl = document.getElementById("title");
  const selLabel = document.getElementById("selDateLabel");
  const memoEl = document.getElementById("memo");
  const saveBtn = document.getElementById("saveBtn");
  const updatedAtEl = document.getElementById("updatedAt");

  let cur = new Date();
  cur.setDate(1);
  let selectedDate = null;
  let monthMemos = new Map(); // date -> memo

  DOW.forEach(d => {
    const div = document.createElement("div");
    div.className = "dow";
    div.textContent = d;
    dowEl.appendChild(div);
  });

  function yyyy_mm_dd(dt){
    const y = dt.getFullYear();
    const m = String(dt.getMonth()+1).padStart(2,'0');
    const d = String(dt.getDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }

  async function loadMonth(){
    const y = cur.getFullYear();
    const m = cur.getMonth()+1;
    titleEl.textContent = `${y}년 ${m}월 공유 메모 달력`;
    const res = await fetch(`/api/calendar/month?year=${y}&month=${m}`);
    const data = await res.json();
    monthMemos = new Map();
    (data.items || []).forEach(it => {
      if ((it.memo||"").trim().length > 0) monthMemos.set(it.date, it.memo);
    });
    renderGrid();
  }

  function renderGrid(){
    gridEl.innerHTML = "";
    const y = cur.getFullYear();
    const m = cur.getMonth();
    const firstDay = new Date(y, m, 1);
    const startDow = firstDay.getDay();
    const daysInMonth = new Date(y, m+1, 0).getDate();

    // padding previous month
    for(let i=0;i<startDow;i++){
      const pad = document.createElement("div");
      pad.className = "day off";
      pad.innerHTML = "<div class='num'> </div>";
      gridEl.appendChild(pad);
    }

    for(let d=1; d<=daysInMonth; d++){
      const dt = new Date(y, m, d);
      const dateStr = yyyy_mm_dd(dt);
      const memo = monthMemos.get(dateStr) || "";
      const day = document.createElement("div");
      day.className = "day" + (memo ? " has-memo" : "");
      day.innerHTML = `
        <div class="num">${d}</div>
        <div class="dot"></div>
        <div class="preview">${memo ? memo.slice(0, 80) : ""}</div>
      `;
      day.addEventListener("click", () => selectDate(dateStr));
      gridEl.appendChild(day);
    }
  }

  async function selectDate(dateStr){
    selectedDate = dateStr;
    selLabel.textContent = `선택 날짜: ${dateStr}`;
    saveBtn.disabled = true;
    updatedAtEl.textContent = "";
    const res = await fetch(`/api/calendar/note?date=${encodeURIComponent(dateStr)}`);
    const data = await res.json();
    memoEl.value = data.memo || "";
    updatedAtEl.textContent = data.updated_at ? `마지막 저장: ${data.updated_at}` : "저장 기록 없음";
    saveBtn.disabled = false;
  }

  async function save(){
    if(!selectedDate) return;
    saveBtn.disabled = true;
    const fd = new FormData();
    fd.append("date", selectedDate);
    fd.append("memo", memoEl.value || "");
    const res = await fetch("/api/calendar/note", { method:"POST", body: fd });
    const data = await res.json();
    if(data.ok){
      updatedAtEl.textContent = `마지막 저장: ${data.updated_at}`;
      // refresh month
      await loadMonth();
    }else{
      alert("저장 실패");
    }
    saveBtn.disabled = false;
  }

  document.getElementById("prevBtn").addEventListener("click", async () => {
    cur.setMonth(cur.getMonth()-1);
    cur.setDate(1);
    await loadMonth();
  });
  document.getElementById("nextBtn").addEventListener("click", async () => {
    cur.setMonth(cur.getMonth()+1);
    cur.setDate(1);
    await loadMonth();
  });
  document.getElementById("todayBtn").addEventListener("click", async () => {
    const t = new Date();
    cur = new Date(t.getFullYear(), t.getMonth(), 1);
    await loadMonth();
    await selectDate(yyyy_mm_dd(t));
  });
  saveBtn.addEventListener("click", save);

  loadMonth();
</script>
</body>
</html>
