<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>달력 메모</title>
  <link rel="stylesheet" href="/static/app.css">
  <style>
    .wrap { max-width: 1100px; margin: 18px auto; padding: 0 16px; }
    .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 18px; }
    .topbar { display:flex; gap:10px; align-items:center; justify-content:space-between; margin-bottom: 12px; }
    .topbar .left { display:flex; gap:10px; align-items:center; }
    .btn { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10); color:#fff; padding:10px 12px; border-radius:10px; cursor:pointer; }
    .btn:hover { background: rgba(255,255,255,0.10); }
    .title { font-size: 18px; font-weight: 700; }
    .grid { display:grid; grid-template-columns: 1fr 360px; gap: 14px; }
    @media (max-width: 920px) { .grid { grid-template-columns: 1fr; } }
    .cal { border-radius: 12px; overflow:hidden; border: 1px solid rgba(255,255,255,0.08); }
    .dow { display:grid; grid-template-columns: repeat(7, 1fr); background: rgba(255,255,255,0.04); }
    .dow div { padding:10px; text-align:center; font-size: 13px; color: #cfcfcf; border-right: 1px solid rgba(255,255,255,0.06); }
    .dow div:last-child { border-right:none; }
    .days { display:grid; grid-template-columns: repeat(7, 1fr); }
    .day { min-height: 80px; padding: 10px; border-right: 1px solid rgba(255,255,255,0.06); border-bottom: 1px solid rgba(255,255,255,0.06); cursor:pointer; position:relative; }
    .day:nth-child(7n) { border-right:none; }
    .day.muted { color: rgba(255,255,255,0.35); }
    .day .num { font-weight: 700; font-size: 14px; }
    .day .dot { position:absolute; right:10px; top:10px; width:8px; height:8px; border-radius:99px; background: #66e3a1; display:none; }
    .day.hasmemo .dot { display:block; }
    .day.sel { outline: 2px solid rgba(102,227,161,0.55); outline-offset: -2px; }
    .side .label { font-size: 13px; color: #cfcfcf; margin: 8px 0 6px; }
    input, textarea, select { width:100%; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.10); color:#fff; border-radius: 10px; padding: 10px; }
    textarea { height: 220px; resize: none; } /* 박스가 옆으로 늘어나지 않게 */
    .mutetext { font-size: 12px; color: rgba(255,255,255,0.55); margin-top: 8px; }
    .row { display:flex; gap:10px; }
    .row > * { flex:1; }
    .toast { margin-top: 10px; font-size: 13px; color:#66e3a1; display:none; }
    a.link { color:#9ecbff; text-decoration:none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="left">
        <button class="btn" onclick="location.href='/'">← 홈</button>
        <div class="title">달력 메모</div>
      </div>
      <div class="left">
        <button class="btn" id="prevBtn">◀</button>
        <div class="title" id="ymTitle"></div>
        <button class="btn" id="nextBtn">▶</button>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="cal">
          <div class="dow">
            <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
          </div>
          <div class="days" id="days"></div>
        </div>
      </div>

      <div class="card side">
        <div class="label">선택 날짜</div>
        <input id="selDate" readonly />
        <div class="label">작성자(선택)</div>
        <input id="author" placeholder="예: 홍길동" />
        <div class="label">메모</div>
        <textarea id="memo" placeholder="메모를 입력하세요 (공유용)"></textarea>
        <div class="row" style="margin-top:10px;">
          <button class="btn" id="saveBtn">저장</button>
          <button class="btn" id="clearBtn">비우기</button>
        </div>
        <div class="toast" id="toast">저장 완료</div>
        <div class="mutetext">
          • 이 메모는 누구나(로그인 전 기준) 공유로 사용합니다.<br/>
          • 달이 넘어가도 저장된 메모는 유지됩니다.
        </div>
      </div>
    </div>
  </div>

<script>
(function(){
  let year = {{ year }};
  let month = {{ month }}; // 1-12
  let selectedDate = null;
  let monthMemos = {}; // date -> {content, author}

  const ymTitle = document.getElementById('ymTitle');
  const daysEl = document.getElementById('days');
  const selDateEl = document.getElementById('selDate');
  const authorEl = document.getElementById('author');
  const memoEl = document.getElementById('memo');
  const toastEl = document.getElementById('toast');

  function pad(n){ return String(n).padStart(2,'0'); }
  function ymd(y,m,d){ return `${y}-${pad(m)}-${pad(d)}`; }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.style.display='block';
    setTimeout(()=>toastEl.style.display='none', 1200);
  }

  async function loadMonthMemos(){
    monthMemos = {};
    const res = await fetch(`/api/calendar/month?year=${year}&month=${month}`);
    const arr = await res.json();
    for(const it of arr){
      monthMemos[it.date] = { content: it.content || '', author: it.author || '' };
    }
  }

  function buildCalendar(){
    ymTitle.textContent = `${year}년 ${month}월`;
    daysEl.innerHTML = '';

    const first = new Date(year, month-1, 1);
    const last = new Date(year, month, 0);
    const startDow = first.getDay(); // 0 sun
    const daysInMonth = last.getDate();

    // previous month padding
    const prevLast = new Date(year, month-1, 0).getDate();
    for(let i=0;i<startDow;i++){
      const d = prevLast - (startDow-1-i);
      const cell = document.createElement('div');
      cell.className = 'day muted';
      cell.innerHTML = `<div class="num">${d}</div>`;
      daysEl.appendChild(cell);
    }

    for(let d=1; d<=daysInMonth; d++){
      const dateStr = ymd(year, month, d);
      const cell = document.createElement('div');
      cell.className = 'day';
      cell.dataset.date = dateStr;
      cell.innerHTML = `<div class="dot"></div><div class="num">${d}</div>`;
      if(monthMemos[dateStr] && (monthMemos[dateStr].content || '').trim() !== ''){
        cell.classList.add('hasmemo');
      }
      cell.addEventListener('click', ()=>selectDay(dateStr));
      daysEl.appendChild(cell);
    }

    // next month padding to complete grid (up to 42 cells)
    const totalCells = daysEl.children.length;
    const add = (7 - (totalCells % 7)) % 7;
    for(let i=1;i<=add;i++){
      const cell = document.createElement('div');
      cell.className = 'day muted';
      cell.innerHTML = `<div class="num">${i}</div>`;
      daysEl.appendChild(cell);
    }
  }

  function clearSelHighlight(){
    document.querySelectorAll('.day.sel').forEach(el=>el.classList.remove('sel'));
  }

  async function selectDay(dateStr){
    selectedDate = dateStr;
    selDateEl.value = dateStr;
    clearSelHighlight();
    const el = document.querySelector(`.day[data-date="${dateStr}"]`);
    if(el) el.classList.add('sel');

    // prefer cached month memo
    if(monthMemos[dateStr]){
      memoEl.value = monthMemos[dateStr].content || '';
      authorEl.value = monthMemos[dateStr].author || '';
      return;
    }

    const res = await fetch(`/api/calendar/get?date=${encodeURIComponent(dateStr)}`);
    const data = await res.json();
    memoEl.value = data.content || '';
    authorEl.value = data.author || '';
  }

  async function saveMemo(){
    if(!selectedDate){
      alert('날짜를 먼저 선택하세요.');
      return;
    }
    const fd = new FormData();
    fd.append('date', selectedDate);
    fd.append('content', memoEl.value || '');
    fd.append('author', authorEl.value || '');
    const res = await fetch('/api/calendar/save', { method:'POST', body: fd });
    if(!res.ok){
      const t = await res.text();
      alert('저장 실패: ' + t);
      return;
    }
    monthMemos[selectedDate] = { content: memoEl.value || '', author: authorEl.value || '' };
    // update dot
    const el = document.querySelector(`.day[data-date="${selectedDate}"]`);
    if(el){
      if((memoEl.value||'').trim() !== '') el.classList.add('hasmemo');
      else el.classList.remove('hasmemo');
    }
    showToast('저장 완료');
  }

  function clearMemo(){
    memoEl.value = '';
  }

  async function refresh(){
    await loadMonthMemos();
    buildCalendar();
    // auto select today if current month
    const today = new Date();
    if(today.getFullYear()===year && (today.getMonth()+1)===month){
      selectDay(ymd(year, month, today.getDate()));
    } else {
      selectedDate = null;
      selDateEl.value = '';
      memoEl.value = '';
    }
  }

  document.getElementById('saveBtn').addEventListener('click', saveMemo);
  document.getElementById('clearBtn').addEventListener('click', clearMemo);

  document.getElementById('prevBtn').addEventListener('click', async ()=>{
    month -= 1;
    if(month===0){ month=12; year-=1; }
    await refresh();
  });
  document.getElementById('nextBtn').addEventListener('click', async ()=>{
    month += 1;
    if(month===13){ month=1; year+=1; }
    await refresh();
  });

  refresh();
})();
</script>
</body>
</html>
