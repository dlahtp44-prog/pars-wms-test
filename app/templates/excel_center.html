<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>엑셀 센터 | PARS WMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 공통 CSS -->
    <link rel="stylesheet" href="/static/app.css">

    <style>
        .excel-center {
            max-width: 1200px;
            margin: 40px auto;
        }
        .excel-box {
            border: 1px solid #333;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 24px;
            background: #111;
        }
        .excel-box h2 {
            margin-bottom: 12px;
        }
        .excel-box p {
            color: #aaa;
            margin-bottom: 16px;
        }
        .excel-box a, .excel-box button {
            display: inline-block;
            margin-right: 8px;
        }
    </style>
</head>

<body>
<div class="excel-center">
    <h1>📊 엑셀 센터 (B 확장)</h1>
    <p>입고 / 출고 엑셀 업로드 및 다운로드 전용 관리자 화면</p>

    <!-- 입고 -->
    <div class="excel-box">
        <h2>📥 입고 엑셀</h2>
        <p>입고 데이터 일괄 등록</p>
        <a href="/static/excel/inbound_template.xlsx" class="btn">📄 양식 다운로드</a>
        <form action="/api/excel/inbound" method="post" enctype="multipart/form-data">
            <input type="file" name="file" required>
            <button type="submit">업로드</button>
        </form>
    </div>

    <!-- 출고 -->
    <div class="excel-box">
        <h2>📤 출고 엑셀</h2>
        <p>출고 데이터 일괄 처리</p>
        <a href="/static/excel/outbound_template.xlsx" class="btn">📄 양식 다운로드</a>
        <form action="/api/excel/outbound" method="post" enctype="multipart/form-data">
            <input type="file" name="file" required>
            <button type="submit">업로드</button>
        </form>
    </div>

    <!-- 다운로드 -->
    <div class="excel-box">
        <h2>📦 데이터 다운로드</h2>
        <a href="/page/inventory/excel" class="btn">재고 엑셀 다운로드</a>
        <a href="/page/history/excel" class="btn">이력 엑셀 다운로드</a>
    </div>

</div>
</body>
</html>
