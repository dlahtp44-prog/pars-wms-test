{% extends "m/base.html" %}
{% block content %}

<h2>출발 로케이션</h2>

<form method="get">
    <input name="location" placeholder="로케이션 QR 스캔" value="{{ location }}" required>
    <button type="submit">조회</button>
</form>

{% if items %}
<hr>
<h3>재고 목록</h3>

{% for i in items %}
<form method="post" action="/m/move/qty">
    <input type="hidden" name="from_location" value="{{ location }}">
    <input type="hidden" name="item_code" value="{{ i[1] }}">
    <input type="hidden" name="item_name" value="{{ i[2] }}">
    <input type="hidden" name="lot" value="{{ i[3] }}">
    <input type="hidden" name="spec" value="{{ i[4] }}">

    <button>
        {{ i[2] }} ({{ i[4] }}) / LOT {{ i[3] }} / 수량 {{ i[5] }}
    </button>
</form>
{% endfor %}
{% endif %}

{% endblock %}
