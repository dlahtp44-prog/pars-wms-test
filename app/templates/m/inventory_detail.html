<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>로케이션 재고</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>

<h3>📍 로케이션: {{ location }}</h3>

<table>
  <thead>
    <tr>
      <th>품번</th>
      <th>품명</th>
      <th>LOT</th>
      <th>규격</th>
      <th>수량</th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>

<div style="margin-top:12px;">
  <a href="/m/qr">⬅ 다시 스캔</a>
</div>

<script>
async function loadInventory() {
  const res = await fetch(`/api/inventory?location={{ location }}`);
  const data = await res.json();

  const tbody = document.getElementById("rows");
  tbody.innerHTML = "";

  if (data.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5">재고 없음</td></tr>`;
    return;
  }

  data.forEach(r => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${r.item_code}</td>
      <td>${r.item_name}</td>
      <td>${r.lot}</td>
      <td>${r.spec}</td>
      <td>${r.qty}</td>
    `;
    tbody.appendChild(tr);
  });
}

loadInventory();
</script>

</body>
</html>
