<!doctype html>
<html lang="ko"><head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="/static/app.css"/>
  <title>이동 완료</title>
</head><body>
<div class="container">
  <div class="card">
    <h2>✅ 이동 완료</h2>
    <p class="small"><b>{{warehouse}}</b> / {{from_location}} → {{to_location}}</p>
    <p class="small">{{item_code}} / {{item_name}}</p>
    <p class="small">LOT: {{lot}} / SPEC: {{spec}} / QTY: <b>{{qty}}</b></p>

    <div class="grid">
      <a class="card" href="/m/move/from">다음 이동</a>
      <a class="card" href="/m">모바일 홈</a>
      <a class="card" href="/page/history">이력(PC형)</a>
    </div>
  </div>
</div>
</body></html>
