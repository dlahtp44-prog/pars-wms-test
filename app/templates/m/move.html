<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>재고 이동</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/app.css">
</head>
<body>

<div class="container">
    <h2>재고 이동</h2>

    <!-- 출발 로케이션 -->
    <div class="card">
        <strong>출발 로케이션</strong>
        <div class="mono">{{ location }}</div>
    </div>

    {% if not location %}
        <p class="hint">QR로 출발 로케이션을 먼저 스캔하세요.</p>
    {% endif %}

    {% for w, loc, code, name, lot, spec, qty in items %}
    <form method="post" action="/api/move" class="card">
        <input type="hidden" name="warehouse" value="{{ w }}">
        <input type="hidden" name="from_location" value="{{ loc }}">
        <input type="hidden" name="item_code" value="{{ code }}">
        <input type="hidden" name="lot" value="{{ lot }}">
        <input type="hidden" name="spec" value="{{ spec }}">

        <div><strong>{{ name }}</strong></div>
        <div class="sub">{{ code }} / {{ lot }} / {{ spec }}</div>
        <div class="sub">보유 수량: {{ qty }}</div>

        <input type="text" name="to_location" placeholder="이동할 로케이션" required>
        <input type="number" name="qty" placeholder="이동 수량" min="1" max="{{ qty }}" required>

        <button type="submit" class="btn-primary">이동</button>
    </form>
    {% endfor %}

    <a href="/m" class="btn">모바일 홈</a>
</div>

</body>
</html>
