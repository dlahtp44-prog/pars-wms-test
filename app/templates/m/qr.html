<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>QR 스캔</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
<h3>QR 스캔 (재고 조회)</h3>

<div id="reader" style="width:100%"></div>

<script>
const qr = new Html5Qrcode("reader");

qr.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    (text) => {
        qr.stop();
        location.href = `/m/qr/inventory?qrtext=${encodeURIComponent(text)}`;
    }
);
</script>
</body>
</html>
