<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="/static/app.css"/>
  <title>출발 로케이션</title>
</head>
<body>
<div class="container">
  <div class="card">
    <h2>출발 로케이션</h2>
    <form method="get" action="/m/move/select">
      <label>창고</label>
      <input name="warehouse" value="{{warehouse}}" />
      <label>출발 로케이션</label>
      <input name="from_location" value="{{from_location}}" placeholder="스캔 후 자동으로 들어옵니다." />
      <div class="actions">
        <button class="btn" type="submit">품목 선택</button>
        <a class="btn secondary" href="/m">모바일 홈</a>
      </div>
    </form>
  </div>
</div>
</body>
</html>
