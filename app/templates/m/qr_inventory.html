<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>재고 QR 조회</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        body {
            margin: 0;
            padding: 12px;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #111;
            color: #fff;
        }
        #reader {
            width: 100%;
        }
        .hint {
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
            color: #ccc;
        }
    </style>
</head>
<body>

<h3>재고 QR 스캔</h3>

<div id="reader"></div>
<div class="hint">📦 후면 카메라로 스캔 중</div>

<script>
    const html5QrCode = new Html5Qrcode("reader");

    html5QrCode.start(
        { facingMode: { exact: "environment" } }, // ✅ iOS 강제 후면
        {
            fps: 10,
            qrbox: { width: 250, height: 250 }
        },
        qrText => {
            html5QrCode.stop();
            window.location.href = `/m/inventory?qr=${encodeURIComponent(qrText)}`;
        },
        errorMessage => {
            // 스캔 실패 로그 (무시 가능)
        }
    ).catch(err => {
        alert("후면 카메라 접근 실패\n브라우저 권한을 확인하세요.\n" + err);
    });
</script>

</body>
</html>
