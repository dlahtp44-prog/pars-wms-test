<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="/static/app.css"/>
  <title>QR 재고조회</title>
</head>
<body>
<div class="container">
  <div class="card">
    <h2>재고조회</h2>
    <p class="small"><b>{{warehouse}}</b> / <b>{{location}}</b></p>

    <div id="rows" class="box">불러오는 중...</div>

    <div class="actions">
      <a class="btn" href="/m/qr?mode=inventory">다시 스캔</a>
      <a class="btn secondary" href="/m">모바일 홈</a>
    </div>
  </div>
</div>

<script>
async function load(){
  const url = `/api/inventory?warehouse=${encodeURIComponent("{{warehouse}}")}&location=${encodeURIComponent("{{location}}")}&limit=200`;
  const res = await fetch(url);
  const data = await res.json();
  const box = document.getElementById("rows");
  if(!data || data.length===0){
    box.innerHTML = "<p class='small'>해당 로케이션 재고 없음</p>";
    return;
  }
  let html = "<table><thead><tr><th>품번</th><th>품명</th><th>LOT</th><th>규격</th><th>수량</th></tr></thead><tbody>";
  for(const r of data){
    html += `<tr><td>${r.item_code}</td><td>${r.item_name}</td><td>${r.lot||""}</td><td>${r.spec||""}</td><td style="text-align:right;">${r.qty}</td></tr>`;
  }
  html += "</tbody></table>";
  box.innerHTML = html;
}
load();
</script>
</body>
</html>
