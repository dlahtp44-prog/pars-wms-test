<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로케이션 재고</title>
</head>
<body>
<h3>로케이션: {{ location }}</h3>

{% if items %}
<table border="1">
    <tr>
        <th>브랜드</th>
        <th>품번</th>
        <th>품명</th>
        <th>LOT</th>
        <th>규격</th>
        <th>수량</th>
    </tr>
    {% for r in items %}
    <tr>
        <td>{{ r.brand }}</td>
        <td>{{ r.item_code }}</td>
        <td>{{ r.item_name }}</td>
        <td>{{ r.lot }}</td>
        <td>{{ r.spec }}</td>
        <td>{{ r.qty }}</td>
    </tr>
    {% endfor %}
</table>
{% else %}
<p>재고가 없습니다.</p>
{% endif %}
</body>
</html>
