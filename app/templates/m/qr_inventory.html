<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>재고 QR 조회</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        body {
            margin: 0;
            padding: 12px;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #111;
            color: #fff;
        }
        #reader {
            width: 100%;
        }
        .hint {
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
            color: #ccc;
        }
    </style>
</head>
<body>

<h3>재고 QR 스캔</h3>

<div id="reader"></div>
<div class="hint">📦 후면 카메라로 재고 QR을 스캔하세요</div>

<script>
    const html5QrCode = new Html5Qrcode("reader");

    const config = {
        fps: 10,
        qrbox: { width: 250, height: 250 }
    };

    // ✅ 후면 카메라 강제
    Html5Qrcode.getCameras().then(cameras => {
        if (!cameras || cameras.length === 0) {
            alert("카메라를 찾을 수 없습니다.");
            return;
        }

        let cameraId = cameras[0].id;
        for (const cam of cameras) {
            if (cam.label.toLowerCase().includes("back") ||
                cam.label.toLowerCase().includes("rear")) {
                cameraId = cam.id;
                break;
            }
        }

        html5QrCode.start(
            { deviceId: { exact: cameraId } },
            config,
            qrText => {
                html5QrCode.stop();
                window.location.href = `/m/inventory?qr=${encodeURIComponent(qrText)}`;
            }
        );
    }).catch(err => {
        alert("카메라 접근 오류: " + err);
    });
</script>

</body>
</html>
