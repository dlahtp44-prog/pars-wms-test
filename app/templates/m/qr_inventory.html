<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>QR 재고 조회</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 12px;
            background: #f8f9fa;
        }
        h2 {
            text-align: center;
        }
        #reader {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
        }
        .info {
            text-align: center;
            margin-top: 10px;
            color: #555;
            font-size: 14px;
        }
    </style>
</head>
<body>

<h2>📦 QR 재고 조회</h2>

<div id="reader"></div>
<div class="info">
    재고 조회할 QR을 카메라에 비춰주세요.
</div>

<script>
const html5QrCode = new Html5Qrcode("reader");

html5QrCode.start(
    { facingMode: { exact: "environment" } }, // ✅ 후면 카메라 강제
    {
        fps: 10,
        qrbox: { width: 260, height: 260 },
        rememberLastUsedCamera: true
    },
    (decodedText) => {
        html5QrCode.stop().then(() => {
            window.location.href = decodedText;
        });
    },
    (errorMessage) => {
        // 스캔 중 오류 무시
    }
);
</script>

</body>
</html>
