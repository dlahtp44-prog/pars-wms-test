<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="/static/app.css"/>
  <title>품목 선택</title>
</head>
<body>
<div class="container">
  <div class="card">
    <h2>품목 선택</h2>
    <p class="small"><b>{{warehouse}}</b> / <b>{{from_location}}</b></p>

    {% if rows|length == 0 %}
      <p class="small">출발 로케이션에 재고가 없습니다.</p>
      <div class="actions">
        <a class="btn" href="/m/qr?mode=move">다시 스캔</a>
        <a class="btn secondary" href="/m">모바일 홈</a>
      </div>
    {% else %}
    <form method="post" action="/m/move/select">
      <input type="hidden" name="warehouse" value="{{warehouse}}"/>
      <input type="hidden" name="from_location" value="{{from_location}}"/>

      <label>품목 선택</label>
      <select name="item_code" required>
        {% for r in rows %}
          <option value="{{r.item_code}}">{{r.item_code}} / {{r.item_name}} (LOT:{{r.lot}} SPEC:{{r.spec}} QTY:{{r.qty}})</option>
        {% endfor %}
      </select>

      <label>LOT (선택)</label>
      <input name="lot" value=""/>

      <label>규격 (선택)</label>
      <input name="spec" value=""/>

      <div class="actions">
        <button class="btn" type="submit">도착 로케이션 스캔</button>
        <a class="btn secondary" href="/m">모바일 홈</a>
      </div>
    </form>
    {% endif %}
  </div>
</div>
</body>
</html>
