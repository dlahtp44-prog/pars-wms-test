<!doctype html><html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><link rel="stylesheet" href="/static/app.css"/><title>이동 - 품목 선택</title></head><body>
<div class="container"><div class="card"><h2>2) 품목 선택</h2><p class="small"><b>창고</b>: {{warehouse}} / <b>출발</b>: {{from_location}}</p>
{% if rows|length==0 %}<p class="error">출발 로케이션에 재고가 없습니다.</p>{% endif %}
<div style="overflow:auto;margin-top:10px;"><table><thead><tr><th>품번</th><th>품명</th><th>LOT</th><th>규격</th><th style="text-align:right;">수량</th><th></th></tr></thead><tbody>
{% for r in rows %}<tr><td>{{r.item_code}}</td><td>{{r.item_name}}</td><td>{{r.lot}}</td><td>{{r.spec}}</td><td style="text-align:right;">{{r.qty}}</td>
<td><a class="btn" href="/m/move/to?warehouse={{warehouse}}&from_location={{from_location}}&item_code={{r.item_code}}&lot={{r.lot}}&spec={{r.spec}}">선택</a></td></tr>{% endfor %}
</tbody></table></div>
<div class="actions"><a class="btn" href="/m/qr?mode=move">← 출발 다시 스캔</a><a class="btn secondary" href="/m">모바일 홈</a></div>
</div></div></body></html>
