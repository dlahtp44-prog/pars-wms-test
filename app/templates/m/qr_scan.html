<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>QR 스캔</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <link rel="stylesheet" href="/static/app.css"/>
  <style>
    body { margin:0; padding:12px; background:#111; color:#fff; font-family:-apple-system, BlinkMacSystemFont, sans-serif; }
    #reader { width:100%; }
    .hint { text-align:center; margin-top:10px; font-size:13px; color:#cfcfcf; }
    .btnline { display:flex; gap:10px; margin-top:12px; justify-content:center; flex-wrap:wrap; }
  </style>
</head>
<body>
  <h3 style="margin:0 0 10px 0;">QR 스캔 (후면 카메라)</h3>
  <div id="reader"></div>
  <div class="hint">📷 기본은 <b>후면(환경)</b> 카메라로 실행됩니다. 안되면 아래 '카메라 전환'을 눌러주세요.</div>
  <div class="btnline">
    <button id="flip" class="btn" type="button">카메라 전환</button>
    <a class="btn" href="/m">모바일 홈</a>
  </div>

  <form id="postForm" method="post" action="/m/qr/submit" style="display:none;">
    <input type="hidden" name="qrtext" id="qrtext"/>
  </form>

<script>
let html5QrCode = new Html5Qrcode("reader");
let cameras = [];
let camIndex = 0;

const config = { fps: 10, qrbox: { width: 250, height: 250 } };

function onScan(qrText){
  try { html5QrCode.stop(); } catch(e){}
  document.getElementById('qrtext').value = (qrText || "").trim();
  document.getElementById('postForm').submit();
}

async function startWithFacingMode() {
  try {
    await html5QrCode.start({ facingMode: "environment" }, config, onScan);
    return true;
  } catch (e) {
    console.log("facingMode start failed:", e);
    return false;
  }
}

async function startWithDeviceId(id) {
  await html5QrCode.start({ deviceId: { exact: id } }, config, onScan);
}

async function init() {
  // 1) 후면(facingMode) 우선
  const ok = await startWithFacingMode();
  if (ok) return;

  // 2) 실패하면 camera list로 선택
  try {
    cameras = await Html5Qrcode.getCameras();
    if (!cameras || cameras.length === 0) {
      alert("카메라를 찾을 수 없습니다.");
      return;
    }
    camIndex = 0;
    for (let i=0;i<cameras.length;i++){
      const label = (cameras[i].label || "").toLowerCase();
      if (label.includes("back") || label.includes("rear") || label.includes("environment")) {
        camIndex = i;
        break;
      }
    }
    await startWithDeviceId(cameras[camIndex].id);
  } catch (err) {
    alert("카메라 접근 오류: " + err);
  }
}

document.getElementById('flip').addEventListener('click', async ()=>{
  try {
    try { await html5QrCode.stop(); } catch(e){}
    if (!cameras || cameras.length === 0) {
      cameras = await Html5Qrcode.getCameras();
    }
    if (!cameras || cameras.length === 0) return;

    camIndex = (camIndex + 1) % cameras.length;
    await startWithDeviceId(cameras[camIndex].id);
  } catch (e) {
    alert("전환 실패: " + e);
  }
});

init();
</script>
</body>
</html>
