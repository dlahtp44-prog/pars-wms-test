<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="/static/app.css"/>
  <title>{{title}}</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
<div class="container">
  <div class="card">
    <h2>{{title}}</h2>
    {% if desc %}<p class="small">{{desc}}</p>{% endif %}
    <div id="reader" style="width:100%"></div>

    <form id="f" method="post" action="{{action}}">
      {% for k,v in (hidden or {}).items() %}
        <input type="hidden" name="{{k}}" value="{{v}}">
      {% endfor %}

      <label>스캔 결과</label>
      <textarea id="qrtext" name="qrtext" placeholder="스캔되면 자동 입력됩니다. (필요 시 수정 가능)" required></textarea>
      <button type="submit">다음</button>
    </form>

    <p class="small"><a href="/m">← 모바일</a></p>
  </div>
</div>

<script>
const qrtext=document.getElementById('qrtext');
const qr = new Html5Qrcode("reader");

Html5Qrcode.getCameras().then((cameras)=>{
  if (!cameras || cameras.length === 0) return;
  // v1.6.4: 후면 카메라 우선 (가능하면 environment/back)
  const preferred = cameras.find(c => /back|rear|environment/i.test(c.label || ""));
  const cameraId = (preferred || cameras[cameras.length - 1]).id;
  qr.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 260, height: 260 } },
    (decodedText) => { qrtext.value = decodedText; },
    () => {}
  ).catch(() => {
    // facingMode가 안 먹는 환경에서는 cameraId로 재시도
    qr.start(cameraId, { fps: 10, qrbox: { width: 260, height: 260 } }, (decodedText)=>{ qrtext.value = decodedText; }, ()=>{});
  });
}).catch(()=>{});
</script>
</body>
</html>
