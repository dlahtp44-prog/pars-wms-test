<!doctype html><html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><link rel="stylesheet" href="/static/app.css"/><title>QR 스캔</title>
<script src="https://unpkg.com/html5-qrcode"></script></head><body>
<div class="container"><div class="card"><h2>QR 스캔</h2><p class="small">모드: <b>{{mode}}</b></p><div id="reader" style="width:100%"></div>
<form method="post" action="/m/qr/submit" style="margin-top:12px;">
<input type="hidden" name="mode" value="{{mode}}"/>
<label>QR 내용(스캔되면 자동 입력)</label><input id="qr_text" name="qr_text" required/>
<div class="actions"><button type="submit">확인</button><a class="btn secondary" href="/m">모바일 홈</a></div>
</form></div></div>
<script>
const qr=new Html5Qrcode("reader"); const out=document.getElementById("qr_text");
Html5Qrcode.getCameras().then(cams=>{ if(!cams||cams.length===0) return; qr.start(cams[0].id,{fps:10,qrbox:{width:260,height:260}},t=>{out.value=t;},()=>{});}).catch(()=>{});
</script></body></html>
