<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="/static/app.css"/>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <title>도착 스캔</title>
</head>
<body>
<div class="container">
  <div class="card">
    <h2>도착 로케이션 스캔</h2>
    <p class="small">품번: <b>{{item_code}}</b> (LOT: {{lot}} / SPEC: {{spec}})</p>

    <div class="box">
      <div id="reader" style="width:100%;"></div>
      <p class="small">카메라가 안되면 수동 입력</p>
    </div>

    <form id="form" method="post" action="/m/move/do">
      <input type="hidden" name="warehouse" value="{{warehouse}}"/>
      <input type="hidden" name="from_location" value="{{from_location}}"/>
      <input type="hidden" name="item_code" value="{{item_code}}"/>
      <input type="hidden" name="lot" value="{{lot}}"/>
      <input type="hidden" name="spec" value="{{spec}}"/>

      <label>도착 로케이션</label>
      <input id="to_location" name="to_location" placeholder="예: D01-02" required/>

      <label>수량</label>
      <input type="number" name="qty" placeholder="예: 1" required/>

      <div class="actions">
        <button class="btn" type="submit">이동완료</button>
        <a class="btn secondary" href="/m">모바일 홈</a>
      </div>
    </form>

    <div id="scanMsg" class="small"></div>
  </div>
</div>


<script>
let qr = null;
let currentCameraId = null;

async function initCameras() {
  const cams = await Html5Qrcode.getCameras();
  const sel = document.getElementById("cameraSelect");
  if (!cams || cams.length === 0) return;

  sel.innerHTML = "";
  cams.forEach((c) => {
    const opt = document.createElement("option");
    opt.value = c.id;
    opt.textContent = c.label || ("camera-" + c.id);
    sel.appendChild(opt);
  });

  const back = cams.find(c => (c.label || "").toLowerCase().includes("back") || (c.label || "").toLowerCase().includes("rear") || (c.label || "").toLowerCase().includes("environment"));
  const front = cams.find(c => (c.label || "").toLowerCase().includes("front") || (c.label || "").toLowerCase().includes("user"));
  const preferred = back || front || cams[0];
  sel.value = preferred.id;

  await startWithCamera(sel.value);

  sel.addEventListener("change", async () => {
    await startWithCamera(sel.value);
  });

  document.getElementById("toggleBtn").addEventListener("click", async () => {
    const options = Array.from(sel.options).map(o => o.value);
    if (options.length < 2) return;
    const idx = options.indexOf(sel.value);
    const next = options[(idx + 1) % options.length];
    sel.value = next;
    await startWithCamera(next);
  });
}

async function startWithCamera(cameraId){
  const toqr = document.getElementById("to_qr");
  try{
    if (!qr) qr = new Html5Qrcode("reader");
    if (currentCameraId) {
      try { await qr.stop(); } catch(e) {}
      try { await qr.clear(); } catch(e) {}
      qr = new Html5Qrcode("reader");
    }
    currentCameraId = cameraId;

    await qr.start(
      cameraId,
      { fps: 10, qrbox: { width: 260, height: 260 } },
      (decodedText) => { toqr.value = decodedText; },
      () => {}
    );
  }catch(e){
    // 무시
  }
}

initCameras().catch(()=>{});
</script>

</body>
</html>
