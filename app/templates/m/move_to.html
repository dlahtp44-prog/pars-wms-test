<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="/static/app.css"/>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <title>도착 스캔</title>
</head>
<body>
<div class="container">
  <div class="card">
    <h2>도착 로케이션 스캔</h2>
    <p class="small">품번: <b>{{item_code}}</b> (LOT: {{lot}} / SPEC: {{spec}})</p>

    <div class="box">
      <div id="reader" style="width:100%;"></div>
      <p class="small">카메라가 안되면 수동 입력</p>
    </div>

    <form id="form" method="post" action="/m/move/do">
      <input type="hidden" name="warehouse" value="{{warehouse}}"/>
      <input type="hidden" name="from_location" value="{{from_location}}"/>
      <input type="hidden" name="item_code" value="{{item_code}}"/>
      <input type="hidden" name="lot" value="{{lot}}"/>
      <input type="hidden" name="spec" value="{{spec}}"/>

      <label>도착 로케이션</label>
      <input id="to_location" name="to_location" placeholder="예: D01-02" required/>

      <label>수량</label>
      <input type="number" name="qty" placeholder="예: 1" required/>

      <div class="actions">
        <button class="btn" type="submit">이동완료</button>
        <a class="btn secondary" href="/m">모바일 홈</a>
      </div>
    </form>

    <div id="scanMsg" class="small"></div>
  </div>
</div>

<script>
const msg = document.getElementById("scanMsg");
const input = document.getElementById("to_location");

function onScanSuccess(decodedText){
  msg.textContent = "스캔됨: " + decodedText;
  // decodedText가 querystring이면 location만 추출 (간단히)
  let loc = decodedText;
  if(decodedText.includes("location=")){
    try{
      const p = new URLSearchParams(decodedText);
      if(p.get("location")) loc = p.get("location");
    }catch(e){}
  }
  input.value = loc;
}

try{
  const html5QrCode = new Html5Qrcode("reader");
  Html5Qrcode.getCameras().then(cameras => {
    if (cameras && cameras.length) {
      html5QrCode.start(cameras[0].id, { fps: 10, qrbox: 250 }, onScanSuccess, ()=>{});
    } else {
      msg.textContent="카메라 없음";
    }
  }).catch(err => { msg.textContent="권한/지원 문제: "+err; });
}catch(e){
  msg.textContent="QR 라이브러리 로딩 실패: "+e;
}
</script>
</body>
</html>
