<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="/static/app.css"/>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <title>QR 스캔</title>
</head>
<body>
<div class="container">
  <div class="card">
    <h2>QR 스캔 (로케이션)</h2>
    <p class="small">로케이션 QR을 스캔하면 해당 로케이션 재고를 바로 조회합니다.</p>

    <div id="reader" style="width:100%"></div>

    <p class="small" style="margin-top:10px;">
      <a class="btn" href="/m">← 모바일 홈</a>
    </p>
  </div>
</div>

<script>
const html5QrCode = new Html5Qrcode("reader");
html5QrCode.start(
  { facingMode: "environment" },
  { fps: 10, qrbox: 250 },
  (qrText) => {
    window.location.href = "/m/qr/inventory?qrtext=" + encodeURIComponent(qrText);
  }
);
</script>
</body>
</html>
